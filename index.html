<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Urna Eletrônica</title>
      <link rel="stylesheet" href="./assets/css/style.css" />
   </head>
   <body>
      <div class="urna">
         <div class="tela">
            <div class="d-1">
               <div class="d-1-left">
                  <div class="d-1-1"><span>SEU VOTO PARA:</span></div>
                  <div class="d-1-2"><span></span></div>
                  <div class="d-1-3"></div>
                  <div class="d-1-4"></div>
               </div>
               <div class="d-1-right"></div>
            </div>
            <div class="d-2">
               Aperte no teclado: <br />
               CONFIRMA para CONFIRMAR este voto <br />
               CORRIGE para REINICIAR este voto
            </div>
         </div>

         <div class="teclado">
            <div class="teclado--linha">
               <div class="teclado--botao" onclick="numero('1')">1</div>
               <div class="teclado--botao" onclick="numero('2')">2</div>
               <div class="teclado--botao" onclick="numero('3')">3</div>
            </div>
            <div class="teclado--linha">
               <div class="teclado--botao" onclick="numero('4')">4</div>
               <div class="teclado--botao" onclick="numero('5')">5</div>
               <div class="teclado--botao" onclick="numero('6')">6</div>
            </div>
            <div class="teclado--linha">
               <div class="teclado--botao" onclick="numero('7')">7</div>
               <div class="teclado--botao" onclick="numero('8')">8</div>
               <div class="teclado--botao" onclick="numero('9')">9</div>
            </div>
            <div class="teclado--linha">
               <div class="teclado--botao" onclick="numero('0')">0</div>
            </div>
            <div class="teclado--linha">
               <div class="teclado--botao btn--branco" onclick="branco()">
                  BRANCO
               </div>
               <div class="teclado--botao btn--corrige" onclick="corrige()">
                  CORRIGE
               </div>
               <div class="teclado--botao btn--confirma" onclick="confirma()">
                  CONFIRMA
               </div>
            </div>
         </div>
      </div>

      <script src="./assets/js/etapas.js"></script>
      <script src="./assets/js/script.js"></script>
   </body>
</html>
